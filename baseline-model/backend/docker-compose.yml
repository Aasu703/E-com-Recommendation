version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nepali_rec_db, POSTGRES_USER: nepali_rec, POSTGRES_PASSWORD: password }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nepali_rec"], interval: 5s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 5 }
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    environment: { DATABASE_URL: postgresql+asyncpg://nepali_rec:password@postgres/nepali_rec_db, REDIS_URL: redis://redis:6379/0, APP_ENV: production }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    volumes: ["./models:/app/models", "./nepali_ecommerce_data:/app/nepali_ecommerce_data"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3 }
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment: { DATABASE_URL: postgresql+asyncpg://nepali_rec:password@postgres/nepali_rec_db, REDIS_URL: redis://redis:6379/0 }
    depends_on: [redis, postgres]
    volumes: ["./models:/app/models", "./nepali_ecommerce_data:/app/nepali_ecommerce_data"]
    command: celery -A jobs.celery_app worker --loglevel=info
  beat:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment: { REDIS_URL: redis://redis:6379/0 }
    depends_on: [redis]
    command: celery -A jobs.celery_app beat --loglevel=info
volumes:
  postgres_data:
